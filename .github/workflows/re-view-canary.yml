# Daily synthetic canary for the Re:View GitHub App.
#
# Opens a real PR here (a one-line docs change), waits for Re:View to
# (a) post a review as re-view-bot[bot] and (b) complete the "Re:View
# approval" check run on the head commit, then closes the PR and deletes the
# branch. Any failure posts to the Slack incoming webhook in the
# ALERT_WEBHOOK_URL secret. A PR opened with GITHUB_TOKEN does not start other
# workflows, but GitHub App webhooks (what Re:View listens to) still fire.
#
# Docs-only changes are quick-approved by Re:View; that counts as a review.
# Runbook: xl8-ai/re-view docs/runbooks/webhook-e2e.md
name: Re:View canary

on:
  schedule:
    - cron: "17 3 * * *" # daily, 03:17 UTC
  workflow_dispatch:
  pull_request:
    # Self-test when this workflow itself changes. Canary PRs only touch
    # canary/, so they never re-trigger it.
    paths:
      - .github/workflows/re-view-canary.yml

permissions:
  contents: write # create/delete the canary branch and commit
  pull-requests: write # open/close the canary PR
  checks: read # read the Re:View approval check run

concurrency:
  group: re-view-canary
  cancel-in-progress: false

jobs:
  canary:
    # Fork PRs get a read-only token and no secrets; skip them.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      BOT_LOGIN: re-view-bot[bot]
      BOT_APP: re-view-bot # app slug that must own the check run
      CHECK_NAME: Re:View approval
      WAIT_SECONDS: "240"
    steps:
      - name: Open canary PR
        id: open
        run: |
          set -euo pipefail
          branch="canary/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          base=$(gh api "repos/$REPO" --jq .default_branch)
          base_sha=$(gh api "repos/$REPO/branches/$base" --jq .commit.sha)
          gh api "repos/$REPO/git/refs" -f ref="refs/heads/$branch" -f sha="$base_sha" --silent
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

          path=canary/heartbeat.md
          content=$(printf 'Re:View canary heartbeat: run %s at %s\n' "$GITHUB_RUN_ID" "$(date -u +%FT%TZ)" | base64 -w0)
          args=(-f message="docs: Re:View canary heartbeat" -f content="$content" -f branch="$branch")
          if sha=$(gh api "repos/$REPO/contents/$path?ref=$branch" --jq .sha 2>/dev/null); then
            args+=(-f sha="$sha")
          fi
          head=$(gh api -X PUT "repos/$REPO/contents/$path" "${args[@]}" --jq .commit.sha)
          echo "head=$head" >> "$GITHUB_OUTPUT"

          pr=$(gh api "repos/$REPO/pulls" -f title="Re:View canary (run $GITHUB_RUN_ID)" \
            -f head="$branch" -f base="$base" \
            -f body="Automated liveness check for the Re:View GitHub App: ${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}. Closed automatically." \
            --jq .number)
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "Opened PR #$pr on $branch at $head"

      - name: Wait for Re:View review and approval check
        id: wait
        env:
          PR: ${{ steps.open.outputs.pr }}
          HEAD_SHA: ${{ steps.open.outputs.head }}
        run: |
          set -euo pipefail
          start=$SECONDS
          review="" check=""
          check_q=$(jq -rn --arg c "$CHECK_NAME" '$c|@uri')
          # A failed poll (rate limit, 5xx) is retried, but the last error is
          # kept so a canary fault is not mistaken for a Re:View outage.
          # (poll runs in a subshell, so the error goes through a file.)
          last_err="$RUNNER_TEMP/poll-last-error"
          : > "$last_err"
          poll() {
            local out
            if out=$(gh api "$@" 2>"$RUNNER_TEMP/poll.err"); then
              : > "$last_err"  # a later success clears an earlier blip
              printf '%s' "$out"
            else
              printf '%s: %s' "${1%%\?*}" "$(tr '\n' ' ' <"$RUNNER_TEMP/poll.err" | cut -c1-300)" > "$last_err"
              echo "::warning::poll failed: $(cat "$last_err")" >&2
            fi
          }
          while :; do
            if [ -z "$review" ]; then
              review=$(poll "repos/$REPO/pulls/$PR/reviews?per_page=100" \
                --jq "[.[] | select(.user.login == \"$BOT_LOGIN\")][0].state // empty")
              [ -n "$review" ] && review_at=$((SECONDS - start))
            fi
            if [ -z "$check" ]; then
              check=$(poll "repos/$REPO/commits/$HEAD_SHA/check-runs?check_name=$check_q" \
                --jq "[.check_runs[] | select(.app.slug == \"$BOT_APP\" and .status == \"completed\")][0].conclusion // empty")
              [ -n "$check" ] && check_at=$((SECONDS - start))
            fi
            if [ -n "$review" ] && [ -n "$check" ]; then break; fi
            if [ $((SECONDS - start)) -ge "$WAIT_SECONDS" ]; then break; fi
            sleep 15
          done

          {
            echo "### Re:View canary"
            echo "| | result | after |"
            echo "|---|---|---|"
            echo "| review by \`$BOT_LOGIN\` | ${review:-**missing**} | ${review_at:-—}s |"
            echo "| \`$CHECK_NAME\` check (completed) | ${check:-**missing**} | ${check_at:-—}s |"
            echo
            echo "PR: ${GITHUB_SERVER_URL}/${REPO}/pull/$PR, head \`$HEAD_SHA\`"
            if [ -s "$last_err" ]; then echo; echo "Last GitHub API error while polling: \`$(cat "$last_err")\`"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "review=${review:-missing} check=${check:-missing}"

          if [ -z "$review" ] || [ -z "$check" ]; then
            msg="review=${review:-missing}, check=${check:-missing} after ${WAIT_SECONDS}s"
            if [ -s "$last_err" ]; then msg="$msg; last API error: $(cat "$last_err")"; fi
            echo "detail=$msg" >> "$GITHUB_OUTPUT"
            echo "::error::Re:View did not respond: $msg"
            exit 1
          fi

      - name: Close PR and delete branch
        if: always()
        env:
          PR: ${{ steps.open.outputs.pr }}
          BRANCH: ${{ steps.open.outputs.branch }}
        run: |
          if [ -n "$PR" ]; then
            gh api -X PATCH "repos/$REPO/pulls/$PR" -f state=closed --silent || echo "::warning::could not close PR #$PR"
          fi
          if [ -n "$BRANCH" ]; then
            gh api -X DELETE "repos/$REPO/git/refs/heads/$BRANCH" --silent || echo "::warning::could not delete $BRANCH"
          fi

      - name: Alert Slack on failure
        if: failure()
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          OPEN_OUTCOME: ${{ steps.open.outcome }}
          WAIT_OUTCOME: ${{ steps.wait.outcome }}
          WAIT_DETAIL: ${{ steps.wait.outputs.detail }}
        run: |
          if [ -z "$ALERT_WEBHOOK_URL" ]; then
            echo "::warning::ALERT_WEBHOOK_URL secret is not set; no alert sent"
            exit 0
          fi
          run_url="${GITHUB_SERVER_URL}/${REPO}/actions/runs/${GITHUB_RUN_ID}"
          if [ "$WAIT_OUTCOME" = failure ] && [ -n "$WAIT_DETAIL" ]; then
            text="Re:View canary FAILED in ${REPO}: no review from ${BOT_LOGIN} and/or no completed '${CHECK_NAME}' check on a fresh PR (${WAIT_DETAIL}). Webhooks, the queue or the GitHub App may be down. Run: ${run_url}"
          elif [ "$OPEN_OUTCOME" = failure ]; then
            text="Re:View canary could not open its test PR in ${REPO} (canary fault, e.g. token or repo settings; Re:View itself was not tested). Run: ${run_url}"
          else
            text="Re:View canary failed in ${REPO} (canary step error; see the run). Run: ${run_url}"
          fi
          jq -n --arg text "$text" '{text: $text}' |
            curl -fsS -X POST -H 'Content-Type: application/json' --data-binary @- "$ALERT_WEBHOOK_URL" -o /dev/null
